# Catalog config in the Yarn berry style. ts-node-pack must read this to
# resolve `catalog:` deps in the consumer fixture. Both the default
# (unnamed) catalog and a named "dev" catalog are exercised, plus an
# `npm:` alias entry that must survive resolution verbatim.
catalog:
  lodash: ^4.17.21
catalogs:
  dev:
    typescript: ~6.0.3
    # Alias: package on disk is `eslint-plugin-import` but the impl is the
    # import-x soft fork. The `npm:` prefix must be preserved.
    eslint-plugin-import: "npm:eslint-plugin-import-x@4.16.2"
